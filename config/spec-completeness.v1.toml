version = "spec-completeness.v1"
require_blocking_question_owner = true
validity_hours = 24

[[dimensions]]
dimension = "intent"
item_types = ["summary"]
required = true
applicability = "always"
minimum = "sufficient"
gap_classification = "blocking"
question = "What intent should the delivery summary state?"
requested_information = "An explicit delivery summary"

[[dimensions]]
dimension = "problem"
item_types = ["problem"]
required = true
applicability = "always"
minimum = "sufficient"
gap_classification = "blocking"
