name: Python quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_AI_EVALS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - run: python -m pip check
